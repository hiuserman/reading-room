openapi: 3.0.3
info:
  title: 共同本棚の現在の試作API
  version: 0.2.0
  description: 2026-11-16の手元コード。CORS未設定。投稿や一覧GETはまだルート未実装。
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      summary: Go応答確認（DB疎通は確認しない）
      responses:
        '200':
          description: status=ok, message=Hello, World!
  /api/shelves/{shelfID}/books:
    parameters:
      - name: shelfID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: UUIDで本を登録
      description: ShelfBooksへ保存。createdAtは固定。現コードでは空タイトルも受け入れる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                authors:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: message=Book created successfully
        '400':
          description: JSONの読み取り失敗
        '500':
          description: error=Failed to create book
